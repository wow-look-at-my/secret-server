services:
  secret-server:
    container_name: secret-server
    restart: unless-stopped
    image: ghcr.io/wow-look-at-my/secret-server:latest
    volumes:
      - ./data:/data
    environment:
      - LISTEN_ADDR=:8080
      - DATABASE_PATH=/data/secrets.db
      - ENCRYPTION_KEY=${ENCRYPTION_KEY}
      - CF_ACCESS_TEAM_DOMAIN=${CF_ACCESS_TEAM_DOMAIN}
      - CF_ACCESS_ADMIN_AUDIENCE=${CF_ACCESS_ADMIN_AUDIENCE}
      - OIDC_AUDIENCE=${OIDC_AUDIENCE}
      - LOG_LEVEL=info
    labels:
      - docker-updater.enable=true
    networks:
      - nas-public-network

networks:
  nas-public-network:
    external: true
