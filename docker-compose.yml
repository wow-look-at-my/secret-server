services:
  secret-server:
    container_name: secret-server
    image: ghcr.io/wow-look-at-my/secret-server:latest
    volumes:
      - data:/data
    environment:
      - LISTEN_ADDR=:8080
      - DATABASE_PATH=/data/secrets.db
      - AUDIT_DATABASE_PATH=/data/audit.db
      - ENCRYPTION_KEY=${ENCRYPTION_KEY}
      - CF_ACCESS_TEAM_DOMAIN=${CF_ACCESS_TEAM_DOMAIN}
      - CF_ACCESS_ADMIN_AUDIENCE=${CF_ACCESS_ADMIN_AUDIENCE}
      - OIDC_AUDIENCE=${OIDC_AUDIENCE}
      - LOG_LEVEL=info
    networks:
      - nas-public-network

volumes:
  data:

networks:
  nas-public-network:
    external: true
