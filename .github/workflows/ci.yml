name: CI

on:
  push:

permissions:
  contents: read
  id-token: write
  # actions/checks read: the org no-all-builds-job guard (the first step
  # inside wow-look-at-my/go-toolchain@v1) scans the run's jobs and the head
  # commit's check runs since no-all-builds-job#3 (2026-07-20), and FAILS
  # CLOSED when it cannot scan ("Resource not accessible by integration").
  actions: read
  checks: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: wow-look-at-my/go-toolchain@v1
