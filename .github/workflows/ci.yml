name: CI

on:
  push:

permissions:
  # go-toolchain submits the verified dependency snapshot after tests/builds.
  contents: write
  id-token: write
  actions: read
  checks: read
  # go-toolchain autorelease registers the publish and its stored artifacts.
  deployments: write
  artifact-metadata: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: wow-look-at-my/go-toolchain@v1
