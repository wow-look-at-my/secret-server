name: CI

on:
  push:

permissions:
  # go-toolchain submits the verified dependency snapshot after tests/builds.
  contents: write
  id-token: write
  actions: read
  checks: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: wow-look-at-my/go-toolchain@v1
